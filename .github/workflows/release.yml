# Релиз по тегу-версии (как у прошлых релизов: 2.8.1.0).
#   1. Поднять AssemblyVersion в src/PilotLookUp.csproj и закоммитить.
#   2. git tag -a 2.8.1.0 -m "- что изменилось"   (текст тега станет описанием релиза;
#      у легковесного тега берется сообщение коммита)
#   3. git push origin 2.8.1.0
# Тесты здесь не гоняются: им нужен живой клиент Pilot (PilotTestHost).
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Тег совпадает с AssemblyVersion
        shell: pwsh
        run: |
          $version = (Select-Xml -Path src/PilotLookUp.csproj -XPath '//AssemblyVersion').Node.InnerText
          if ($version -ne $env:GITHUB_REF_NAME) {
            throw "Тег $env:GITHUB_REF_NAME не совпадает с AssemblyVersion $version в src/PilotLookUp.csproj"
          }

      # Release-сборка сама собирает bin/Release/PilotLookUp.zip (таргет CreateZip)
      - name: Сборка
        run: dotnet build src/PilotLookUp.csproj -c Release

      - name: Проверка архива
        shell: pwsh
        run: |
          $dll = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path bin/Release/net48/PilotLookUp.ext2.dll)).Version.ToString()
          if ($dll -ne $env:GITHUB_REF_NAME) { throw "Версия PilotLookUp.ext2.dll $dll, ожидалась $env:GITHUB_REF_NAME" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path bin/Release/PilotLookUp.zip))
          $entries = $zip.Entries.FullName
          $zip.Dispose()
          $entries
          if ('PilotLookUp.ext2.dll' -notin $entries) { throw 'В корне архива нет PilotLookUp.ext2.dll' }
          if ($entries -like '*.pdb') { throw 'В архив попали .pdb' }

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" bin/Release/PilotLookUp.zip --title "PilotLookUp $env:GITHUB_REF_NAME" --notes-from-tag
